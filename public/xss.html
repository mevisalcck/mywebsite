<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced XSS Playground</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Advanced XSS Playground</h1>
  <p>This playground simulates real-world vulnerabilities. Try injecting payloads in different contexts.</p>
  
  <!-- Context 1: Attribute context -->
  <h2>Image Alt Attribute</h2>
  <p>Enter a value for an image's alt attribute:</p>
  <input type="text" id="imgAltInput" placeholder="Enter alt text">
  <button onclick="updateImageAlt()">Update Image Alt</button>
  <br>
  <img id="testImage" src="default.png" alt="Default Alt" style="width:200px; margin-top:10px;">
  
  <!-- Context 2: DOM insertion in a <div> -->
  <h2>DOM Insertion</h2>
  <p>Enter HTML content to insert into a div:</p>
  <input type="text" id="domInput" placeholder="Enter HTML">
  <button onclick="updateDom()">Insert Content</button>
  <div id="domOutput" style="border:1px solid #ccc; padding:10px; margin-top:10px;"></div>
  
  <script>
    function updateImageAlt() {
      const altText = document.getElementById("imgAltInput").value;
      // Vulnerable: directly setting an attribute without sanitization
      document.getElementById("testImage").setAttribute("alt", altText);
    }
    function updateDom() {
      const userInput = document.getElementById("domInput").value;
      // Vulnerable: using innerHTML directly
      document.getElementById("domOutput").innerHTML = "User content: " + userInput;
    }
  </script>
</body>
</html>
