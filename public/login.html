<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Load CryptoJS if needed; if using plain JSON for JWT, you may not need it -->
  <script src="js/loginScript.js" defer></script>
</head>
<body>
  <h1>Login</h1>
  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="Enter your email" required />
    <input type="password" id="loginPassword" placeholder="Enter your password" required />
    <br>
    <button type="submit">Login</button>
  </form>
  <p><a href="#" onclick="showForgotPassword()">Forgot Password?</a></p>
  <p>Don't have an account? <a href="register.html">Register</a></p>
  <div id="forgotPasswordForm" style="display: none;">
    <input type="email" id="forgotPasswordEmail" placeholder="Enter your email" required />
    <button id="sendResetBtn">Send Reset Link</button>
  </div>
</body>
</html>
