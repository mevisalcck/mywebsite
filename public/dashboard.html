<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/dashboardScript.js" defer></script>
</head>
<body>
    <h1>Dashboard</h1>
      <a href="/admin">Admin Panel</a><br>
      <a href="blog.html">Post Something</a>
  <main>
    <section id="profileSection">
      <h2>Your Profile</h2>
      <p>Name: <span id="userName"></span></p>
      <p>Email: <span id="userEmail"></span></p>
      <p>Joined: <span id="userCreated"></span></p>
      <p>Last Login: <span id="lastLogin"></span></p>
      <img id="profilePicture" src="default.png" alt="Profile Picture" width="150">
      <form id="uploadForm" enctype="multipart/form-data">
        <input type="file" id="profilePictureInput" accept="image/*">
        <button type="submit">Upload Profile Picture</button>
      </form>
    </section>
    <section id="secureSection">
      <h2>Secure Data</h2>
      <button id="loadSecureDataBtn">Load Secure Data</button>
      <div id="secureDataDiv"></div>
      <a href="#" id="logout-btn">Logout</a>
    </section>
  </main>
  
</body>
</html>
